<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="./src/output.css" >
    <link rel="stylesheet" href="css/styleLogin.css">
</head>

<body class="registro-body">

<div id="cargaMensaje-registro" class="carga-registro">
    <div class="animacion-carga"></div>
    <p> Creando cuenta...</p>
</div>

<header class="contenedor-header">
    <h1 class="titulo-404-header">404</h1>
</header>

<section class="seccion-loginYregistroContain">
    <div class="registro-container">
        
        <h1 class="titulo-crear-cuenta">Crear Cuenta</h1>

        <form id="registro-form">
            <input type="text" id="nombre" placeholder="Nombre">
            <input type="email" id="email" placeholder="Correo">
            <input type="password" id="password" placeholder="Contraseña">
            <button type="submit">Crear</button>
        </form>

    </div>
</section>

<div id="mensaje-registro-exitoso"></div>

<script type="module" src="./js/crearCuenta.js"></script>

</body>
</html>
